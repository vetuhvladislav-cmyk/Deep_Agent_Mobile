name: Android

# Основной путь сборки Deep Agent APK — GitHub Actions.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка Deep Agent debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Модульные тесты
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Сборка APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Артефакт
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deep-agent-mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

  release:
    permissions:
      contents: write
    name: Публикация Deep Agent APK
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Опубликовать APK v0.1.0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Переименовать APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/deep-agent-mobile-v0.1.0-test.apk"

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Установочный APK Deep Agent Mobile v0.1.0-test.
            Сборка отладочная и предназначена для тестирования на Android.
