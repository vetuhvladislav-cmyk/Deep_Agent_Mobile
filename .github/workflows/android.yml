on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать APK в GitHub Release"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Тег релиза (используется при публикации)"
        required: true
        default: "v0.1.0"
        type: string
      agent_session_id:
        description: "Correlation ID сессии Agent Core"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Сборка Deep Agent debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Модульные тесты
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Сборка APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Checksum и provenance
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          sha256sum "$apk" > "$apk.sha256"
          printf '{"source_sha":"%s","artifact_type":"apk","file":"%s"}\n' \
            "$GITHUB_SHA" "$(basename "$apk")" \
            > app/build/outputs/apk/debug/deep-agent-provenance.json

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: deep-agent-mobile-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk.sha256
            app/build/outputs/apk/debug/deep-agent-provenance.json
          if-no-files-found: error
          retention-days: 3

  release:
    permissions:
      contents: write
    name: Публикация Deep Agent APK
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Переименовать APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/deep-agent-mobile-${{ inputs.release_tag }}-test.apk"

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Установочный APK Deep Agent Mobile ${{ inputs.release_tag }}-test.
            Сборка отладочная и предназначена для тестирования на Android.
