name: Deep Agent Mobile
run-name: "Deep Agent Mobile / ${{ inputs.agent_session_id || 'manual' }} / ${{ inputs.operation_id || 'unknown' }}"

concurrency:
  group: deep-agent-mobile-${{ github.ref }}
  cancel-in-progress: false

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать APK в GitHub Release"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Тег релиза (используется при публикации)"
        required: true
        default: "v0.1.6"
        type: string
      agent_session_id:
        description: "Correlation ID сессии Agent Core"
        required: false
        default: ""
        type: string
      operation_id:
        description: "Correlation ID операции Agent Core"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Сборка Deep Agent debug APK
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
      PUBLISH_RELEASE: ${{ github.event_name == 'release' || inputs.publish_release }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: CanonicalArgs reference vectors
        run: python3 tools/canonical_args_reference.py app/src/test/resources/canonical_args_v1_vectors.json

      - name: Модульные тесты
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Компиляция instrumentation tests
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      - name: Сборка APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Checksum и provenance
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          sha256sum "$apk" > "$apk.sha256"
          printf '{"source_sha":"%s","artifact_type":"apk","file":"%s"}\n' \
            "$GITHUB_SHA" "$(basename "$apk")" \
            > app/build/outputs/apk/debug/deep-agent-provenance.json

      - name: Загрузить проверяемый Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-agent-mobile-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk.sha256
            app/build/outputs/apk/debug/deep-agent-provenance.json
          if-no-files-found: error
          retention-days: 7
        continue-on-error: true


  ui-runtime:
    name: Android UI runtime acceptance
    continue-on-error: true
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK emulator packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      # На Linux-образе эмулятору нужны системные библиотеки, которых нет в
      # минимальной поставке. Ставим только необходимый набор.
      - name: Системные библиотеки эмулятора
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpulse0 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 libglu1-mesa

      # KVM доступен на стандартном Linux-runner. Разрешения выдаются явно, а job
      # проверяет их сам: без /dev/kvm падаем на понятной диагностике, а не на
      # таймауте загрузки эмулятора.
      - name: Включение KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Проверка окружения UI runtime
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "Архитектура хоста: $arch"
          test "$arch" = "x86_64" || { echo "Ожидался x86_64 host, получен $arch" >&2; exit 1; }
          test -r /dev/kvm || { echo "/dev/kvm недоступен на чтение" >&2; exit 1; }
          test -w /dev/kvm || { echo "/dev/kvm недоступен на запись" >&2; exit 1; }
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk_root"
          test -d "$android_sdk_root/system-images/android-35/google_apis/x86_64" || {
            echo "Не установлен system-images;android-35;google_apis;x86_64" >&2
            exit 1
          }
          emulator_bin="$android_sdk_root/emulator/emulator"
          test -x "$emulator_bin" || { echo "emulator не установлен: $emulator_bin" >&2; exit 1; }
          missing="$(ldd "$emulator_bin" 2>/dev/null | awk '/not found/ {print $1}' | sort -u || true)"
          if [ -n "$missing" ]; then
            echo "Эмулятору не хватает библиотек:" >&2
            echo "$missing" >&2
            exit 1
          fi
          # Диагностика ускорения печатается в лог; падать здесь не нужно —
          # отсутствие KVM уже отловлено проверками выше.
          "$emulator_bin" -accel-check || true

      - name: Компиляция instrumentation tests
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      - name: Android UI runtime tests
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="${RUNNER_TEMP}/.android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf "no\n" | avdmanager create avd \
            --force \
            --name deep-agent-api-35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2"
          # По умолчанию AVD просит под userdata около 7.4 ГБ и падает на диске
          # runner'а; уменьшаем раздел данных до 2 ГБ.
          avd_config="$ANDROID_AVD_HOME/deep-agent-api-35.avd/config.ini"
          test -f "$avd_config"
          sed -i '/^disk\.dataPartition\.size=/d' "$avd_config"
          printf 'disk.dataPartition.size=2G\n' >> "$avd_config"
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk_root"
          emulator_bin="$android_sdk_root/emulator/emulator"
          test -x "$emulator_bin"
          echo "Using emulator binary: $emulator_bin"
          nohup "$emulator_bin" -avd deep-agent-api-35 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader \
            -accel auto \
            > "${RUNNER_TEMP}/deep-agent-emulator.log" 2>&1 &
          trap "adb emu kill >/dev/null 2>&1 || true" EXIT
          wait_for_device_deadline=$((SECONDS + 300))
          while ! adb get-state >/dev/null 2>&1; do
            if (( SECONDS >= wait_for_device_deadline )); then
              echo "Emulator did not register with ADB within 300 seconds" >&2
              cat "${RUNNER_TEMP}/deep-agent-emulator.log" || true
              adb devices || true
              exit 1
            fi
            sleep 5
          done
          boot_completed=false
          boot_deadline=$((SECONDS + 600))
          while (( SECONDS < boot_deadline )); do
            if adb shell getprop sys.boot_completed | tr -d "\r" | grep -q "^1"; then
              boot_completed=true
              break
            fi
            sleep 5
          done
          if [[ "$boot_completed" != "true" ]]; then
            cat "${RUNNER_TEMP}/deep-agent-emulator.log" || true
            adb devices || true
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./gradlew --no-daemon connectedDebugAndroidTest


  release:
    name: Публикация APK в GitHub Release
    needs: [build]
    if: ${{ github.event_name == 'release' || inputs.publish_release }}
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
      PUBLISH_RELEASE: ${{ github.event_name == 'release' || inputs.publish_release }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Проверить параметры релиза
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          AGENT_SESSION_ID: ${{ inputs.agent_session_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.-]+)?$ ]] || {
            echo "Недопустимый release tag" >&2
            exit 1
          }
          if [[ -n "$AGENT_SESSION_ID" ]]; then
            [[ "$AGENT_SESSION_ID" =~ ^[A-Za-z0-9._:-]{1,160}$ ]] || {
              echo "Недопустимый agent session id" >&2
              exit 1
            }
          fi

      - name: Сборка APK для release
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Checksum и provenance release APK
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          sha256sum "$apk" > "$apk.sha256"
          printf '{"source_sha":"%s","artifact_type":"apk","file":"%s"}' "$GITHUB_SHA" "$(basename "$apk")" > app/build/outputs/apk/debug/deep-agent-provenance.json
      - name: Подготовить release files
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -f "$apk.sha256"
          test -f app/build/outputs/apk/debug/deep-agent-provenance.json
          mkdir -p dist
          cp "$apk" "dist/deep-agent-mobile-${RELEASE_TAG}-test.apk"
          cp "$apk.sha256" "dist/deep-agent-mobile-${RELEASE_TAG}-test.apk.sha256"
          cp app/build/outputs/apk/debug/deep-agent-provenance.json dist/deep-agent-provenance.json

      - name: Публикация релиза
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
          body: |
            APK подготовлен после успешной обязательной Linux build gate.
            UI runtime acceptance выполняется отдельным job и не блокирует публикацию APK.
            Модульные тесты, instrumentation tests и instrumentation compilation завершены до публикации.
            Сборка отладочная и предназначена для тестирования на Android.
